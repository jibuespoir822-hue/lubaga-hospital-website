
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lubaga Hospital | Appointment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark hospital-nav sticky-top">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            LUBAGA <span>HOSPITAL</span>
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="About.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="Services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link active" href="appointment.html">Appointment</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>

            <a href="appointment.html" class="btn btn-light ms-lg-3">Book a Visit</a>

        </div>
    </div>
</nav>

<header class="page-banner">
    <div class="container">
        <p class="eyebrow">PLAN YOUR VISIT</p>
        <h1>Appointment Request</h1>
        <p>Complete the form below.</p>
    </div>
</header>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="form-panel">

                <h2>Patient Information</h2>

                <p class="text-muted">
                    Enter your details in the demonstration form.
                </p>

                <form id="appointmentForm">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control"
                                id="fullName" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control"
                                id="phone" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control"
                                id="email">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Department</label>

                            <select class="form-select" required>
                                <option value="">Choose Department</option>
                                <option>General Consultation</option>
                                <option>Maternity</option>
                                <option>Paediatrics</option>
                                <option>Laboratory</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Preferred Date</label>
                            <input type="date" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Preferred Time</label>
                            <input type="time" class="form-control" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Additional Message</label>
                            <textarea class="form-control" rows="4"
                                placeholder="Enter your message"></textarea>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Submit Request
                            </button>
                        </div>

                    </div>

                </form>

                <div id="formMessage" class="mt-3"></div>

            </div>

        </div>

    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <p>© 2026 Lubaga Hospital Website Project</p>
        <a href="index.html">Back to Home</a>
    </div>
</footer>

<script>
document.getElementById("appointmentForm").addEventListener("submit",
function(event) {

    event.preventDefault();

    document.getElementById("formMessage").innerHTML =
    '<div class="alert alert-success">' +
    'Demo form validated successfully. No real appointment has been booked.' +
    '</div>';

    this.reset();

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
